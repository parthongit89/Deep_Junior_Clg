<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface-container-lowest border-b border-outline-variant z-50">
<div class="flex justify-between items-center h-16 max-w-max-width mx-auto px-margin-desktop">
<div class="flex items-center gap-xl">
<span class="font-headline-md text-headline-md font-bold text-primary">Deep Junior College</span>
<nav class="hidden md:flex gap-md">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer transition-all duration-200" href="/home">Dashboard</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer transition-all duration-200" href="/services">Services</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer transition-all duration-200" href="/support">Support</a>
</nav>
</div>
<div class="flex items-center gap-sm">
<a href="/login" class="text-secondary font-label-md text-label-md hover:underline mr-2">Login</a>
<a href="/register" class="bg-primary text-white hover:brightness-95 px-4 py-2 rounded-lg font-bold text-label-md transition-all shadow-sm">Register</a>
</div>
</div>
</header>

<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center py-xl px-margin-mobile bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-surface-container-low via-background to-background">
<div class="w-full max-w-md">
<!-- Reset Password Card -->
<div class="bg-white rounded-xl border border-outline-variant p-lg shadow-[0_4px_12px_rgba(15,23,42,0.04)]">
<div class="text-center mb-md">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container/10 mb-sm">
<span class="material-symbols-outlined text-primary text-3xl">lock_reset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Forgot Password</h1>
<p class="font-body-sm text-body-sm text-on-tertiary-fixed-variant px-sm">
    Enter your Student ID and registered Email Address to verify your account and reset your password.
</p>
</div>
<form class="space-y-md" id="forgotForm">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="student-id">Student ID / Seat No</label>
<input class="h-12 w-full px-sm border border-outline-variant rounded-lg bg-white focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body-md" id="student-id" name="studentId" placeholder="e.g. M005020" required="" type="text">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="h-12 w-full px-sm border border-outline-variant rounded-lg bg-white focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body-md" id="email" name="email" placeholder="example@university.edu" required="" type="email">
</div>
<button class="w-full h-12 bg-primary-container hover:bg-[#0ea673] text-white font-bold rounded-lg transition-all transform active:scale-[0.98] flex items-center justify-center gap-xs mt-md shadow-md hover:shadow-lg" type="submit">
<span class="">Verify Account</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
</div>
<div class="hidden mt-md bg-green-50 border border-green-200 text-green-800 p-sm rounded-lg flex items-center gap-sm" id="successMessage">
<span class="material-symbols-outlined text-green-600">check_circle</span>
<span class="font-body-sm text-body-sm">Account verified! Redirecting to password reset...</span>
</div>
</div>
</main>

<script>
document.getElementById('forgotForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const studentId = document.getElementById('student-id').value.trim();
    const email = document.getElementById('email').value.trim();
    
    fetch('/forgot_password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ studentId, email })
    })
    .then(res => {
        if (res.ok) {
            return res.json().then(data => {
                document.getElementById('successMessage').classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1500);
            });
        } else {
            return res.json().then(err => {
                alert(err.message || 'Account verification failed. Please check your credentials.');
            });
        }
    })
    .catch(err => {
        console.error(err);
        alert('Connection error');
    });
});
</script>
</body></html>
